name: CricketIQ Quality Gates & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality:
    name: Backend Lint, Unit & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & libGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Download & Verify AI Model Checksums
        run: |
          python scripts/download_models.py

      - name: Backend Lint Check (Ruff)
        run: |
          ruff check backend/ --ignore E501

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests -v

      - name: Run End-to-End Smoke Test Suite
        run: |
          python scripts/smoke_test.py

  frontend-quality:
    name: Frontend Lint, Typecheck & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Linter Check (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Compile Frontend (TypeScript & Vite Production Build)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright System Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Visual E2E Tests
        working-directory: frontend
        run: npx playwright test
