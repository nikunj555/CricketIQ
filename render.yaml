services:
  - type: web
    name: cricketiq-backend
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
